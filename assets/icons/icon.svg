<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444"/>
      <stop offset="100%" style="stop-color:#CC0000"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" ry="24" fill="url(#bg)"/>

  <!-- Shield shape -->
  <path d="M64 18 L98 34 Q100 35 100 37 L100 62 Q100 85 64 110 Q28 85 28 62 L28 37 Q28 35 30 34 Z"
        fill="url(#shield)" stroke="white" stroke-width="2" opacity="0.95"/>

  <!-- Block / ban circle -->
  <circle cx="64" cy="58" r="24" fill="none" stroke="#CC0000" stroke-width="5"/>
  <line x1="47" y1="41" x2="81" y2="75" stroke="#CC0000" stroke-width="5" stroke-linecap="round"/>

  <!-- Camera lens icon (small, bottom of shield) -->
  <circle cx="64" cy="92" r="7" fill="#CC0000" opacity="0.8"/>
  <circle cx="64" cy="92" r="4" fill="white" opacity="0.9"/>
  <circle cx="64" cy="92" r="2" fill="#CC0000" opacity="0.6"/>
</svg>
