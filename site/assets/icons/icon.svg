<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="128" height="4">
      <rect width="128" height="2" fill="transparent"/>
      <rect y="2" width="128" height="2" fill="rgba(255,255,255,0.04)"/>
    </pattern>
    <clipPath id="bg-clip">
      <rect width="128" height="128"/>
    </clipPath>
  </defs>

  <!-- Hard-edge background — no radius -->
  <rect width="128" height="128" fill="#0a0a0a"/>

  <!-- Scan-line overlay -->
  <rect width="128" height="128" fill="url(#scanlines)"/>

  <!-- Border frame — surveillance monitor feel -->
  <rect x="1" y="1" width="126" height="126" fill="none" stroke="#2a2a2d" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" fill="none" stroke="#1a1a1d" stroke-width="1"/>

  <!-- Eye — outer angular shape -->
  <polygon points="64,30 118,64 64,98 10,64" fill="none" stroke="#E4FF1A" stroke-width="3.5" stroke-linejoin="miter"/>

  <!-- Eye — inner angular shape (iris boundary) -->
  <polygon points="64,42 100,64 64,86 28,64" fill="rgba(228,255,26,0.06)" stroke="#E4FF1A" stroke-width="1.5" stroke-linejoin="miter"/>

  <!-- Pupil — square, not round -->
  <rect x="54" y="54" width="20" height="20" fill="#E4FF1A"/>

  <!-- Pupil inner — dark center -->
  <rect x="59" y="59" width="10" height="10" fill="#0a0a0a"/>

  <!-- Pupil core — chartreuse dot -->
  <rect x="62" y="62" width="4" height="4" fill="#E4FF1A"/>

  <!-- Crosshair lines through pupil -->
  <line x1="64" y1="30" x2="64" y2="50" stroke="#E4FF1A" stroke-width="1" opacity="0.4"/>
  <line x1="64" y1="78" x2="64" y2="98" stroke="#E4FF1A" stroke-width="1" opacity="0.4"/>
  <line x1="10" y1="64" x2="40" y2="64" stroke="#E4FF1A" stroke-width="1" opacity="0.4"/>
  <line x1="88" y1="64" x2="118" y2="64" stroke="#E4FF1A" stroke-width="1" opacity="0.4"/>

  <!-- Corner brackets — HUD / targeting overlay -->
  <!-- Top-left -->
  <polyline points="14,28 14,14 28,14" fill="none" stroke="#E4FF1A" stroke-width="2" opacity="0.5"/>
  <!-- Top-right -->
  <polyline points="100,14 114,14 114,28" fill="none" stroke="#E4FF1A" stroke-width="2" opacity="0.5"/>
  <!-- Bottom-left -->
  <polyline points="14,100 14,114 28,114" fill="none" stroke="#E4FF1A" stroke-width="2" opacity="0.5"/>
  <!-- Bottom-right -->
  <polyline points="100,114 114,114 114,100" fill="none" stroke="#E4FF1A" stroke-width="2" opacity="0.5"/>

  <!-- Small data readout marks — bottom -->
  <rect x="20" y="120" width="8" height="2" fill="#E4FF1A" opacity="0.3"/>
  <rect x="32" y="120" width="4" height="2" fill="#E4FF1A" opacity="0.2"/>
  <rect x="40" y="120" width="12" height="2" fill="#E4FF1A" opacity="0.3"/>
  <rect x="76" y="120" width="10" height="2" fill="#E4FF1A" opacity="0.3"/>
  <rect x="90" y="120" width="6" height="2" fill="#E4FF1A" opacity="0.2"/>
  <rect x="100" y="120" width="8" height="2" fill="#E4FF1A" opacity="0.3"/>
</svg>
