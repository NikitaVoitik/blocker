name: Publish to Chrome Web Store

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version-increased: ${{ steps.release.outputs.version-increased }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check release version
        id: release
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          current = json.load(open('manifest.json'))['version']
          before = os.environ['BEFORE_SHA']
          increased = False
          if before and before != '0' * 40:
              previous = json.loads(subprocess.check_output(
                  ['git', 'show', before + ':manifest.json'], text=True))['version']
              def parts(version):
                  values = tuple(int(part) for part in version.split('.'))
                  return values + (0,) * (4 - len(values))
              increased = parts(current) > parts(previous)
              print(f'Manifest version: {previous} -> {current}; publish: {increased}')
          else:
              print('No previous manifest to compare; skipping publication.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version-increased={str(increased).lower()}\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Full release validation
        run: pnpm run check:deep
        env:
          TEST_SOAK_MS: '900000'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          retention-days: 14
          path: |
            test-results/
            playwright-report/
            validation-results/
            dist/package-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: tested-extension
          if-no-files-found: error
          path: |
            dist/blocker-*.zip
            dist/package.sha256

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.outputs.version-increased == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: echo "version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v5
        with:
          name: tested-extension
          path: dist
      - name: Verify tested artifact
        working-directory: dist
        run: sha256sum --check package.sha256

      - name: Get access token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          TOKEN=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'access_token' not in data:
              print('ERROR: ' + json.dumps(data), file=sys.stderr)
              sys.exit(1)
          print(data['access_token'])
          ")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        run: |
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            -T "dist/blocker-${{ steps.version.outputs.version }}.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.EXTENSION_ID }}")
          echo "$RESPONSE" | python3 -m json.tool
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uploadState','UNKNOWN'))")
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Upload failed with status: $STATUS"
            exit 1
          fi

      - name: Publish
        run: |
          RESPONSE=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.EXTENSION_ID }}/publish")
          echo "$RESPONSE" | python3 scripts/check-publish-response.py
