name: Publish to Chrome Web Store

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version
        id: version
        run: echo "version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Zip extension
        run: |
          mkdir -p dist
          zip -r "dist/blocker-${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" \
            -x ".gitignore" \
            -x ".env" \
            -x ".claude/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "dist/*" \
            -x "tests/*" \
            -x "scripts/*" \
            -x "docs/*" \
            -x "site/*" \
            -x "store-screenshots/*" \
            -x "playwright-report/*" \
            -x "test-results/*" \
            -x "playwright.config.*" \
            -x "package.json" \
            -x "package-lock.json" \
            -x "pnpm-lock.yaml" \
            -x "tsconfig.json" \
            -x "*.md" \
            -x "_metadata/*"

      - name: Get access token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CWS_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CWS_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CWS_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          TOKEN=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'access_token' not in data:
              print('ERROR: ' + json.dumps(data), file=sys.stderr)
              sys.exit(1)
          print(data['access_token'])
          ")
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload to Chrome Web Store
        run: |
          RESPONSE=$(curl -s -X PUT \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            -T "dist/blocker-${{ steps.version.outputs.version }}.zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${{ secrets.CWS_EXTENSION_ID }}")
          echo "$RESPONSE" | python3 -m json.tool
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('uploadState','UNKNOWN'))")
          if [ "$STATUS" != "SUCCESS" ]; then
            echo "Upload failed with status: $STATUS"
            exit 1
          fi

      - name: Publish
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -H "x-goog-api-version: 2" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${{ secrets.CWS_EXTENSION_ID }}/publish" | python3 -m json.tool
          echo "Published v${{ steps.version.outputs.version }}"
