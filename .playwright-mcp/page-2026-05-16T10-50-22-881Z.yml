- generic [ref=e2]:
  - heading "Privacy Policy" [level=1] [ref=e3]
  - paragraph [ref=e4]: "Last updated: May 10, 2026"
  - generic [ref=e5]:
    - heading "Overview" [level=2] [ref=e6]
    - generic [ref=e7]: Punishment Mode is a Chrome extension that blocks distracting websites and tracks browsing attempts locally. This extension does not collect, transmit, or share any user data whatsoever.
  - generic [ref=e8]:
    - heading "Data Storage" [level=2] [ref=e9]
    - generic [ref=e10]:
      - paragraph [ref=e11]:
        - text: All data generated by the extension is stored locally on your device using Chrome's built-in
        - code [ref=e12]: chrome.storage.local
        - text: "API. This includes:"
      - list [ref=e13]:
        - listitem [ref=e14]: —Your list of blocked and tracked websites
        - listitem [ref=e15]: —Attempt counts and timestamps
        - listitem [ref=e16]: —Webcam photos captured on the block page
        - listitem [ref=e17]: —Time tracking statistics
      - paragraph [ref=e18]: None of this data ever leaves your browser. There is no server, no cloud storage, no sync service, and no external database.
  - generic [ref=e19]:
    - heading "Webcam Usage" [level=2] [ref=e20]
    - generic [ref=e21]:
      - paragraph [ref=e22]: The extension uses your device's camera solely to capture a photo when you visit a blocked site. These photos are stored locally in your browser's extension storage. They are never uploaded, transmitted, or shared with any external service or third party.
      - paragraph [ref=e23]: Camera access requires your explicit permission and can be revoked at any time through Chrome's site settings.
  - generic [ref=e24]:
    - heading "Permissions" [level=2] [ref=e25]
    - generic [ref=e26]:
      - paragraph [ref=e27]: "The extension requests the following permissions:"
      - generic [ref=e28]:
        - generic [ref=e29]:
          - paragraph [ref=e30]: declarativeNetRequest / declarativeNetRequestWithHostAccess
          - paragraph [ref=e31]: Required to redirect blocked sites to the extension's block page. Broad host access is necessary because users can block any website of their choice.
        - generic [ref=e32]:
          - paragraph [ref=e33]: storage
          - paragraph [ref=e34]: Required to save your settings, blocked site list, attempt history, and captured photos locally.
        - generic [ref=e35]:
          - paragraph [ref=e36]: offscreen
          - paragraph [ref=e37]: Required to access the camera for photo capture in the background.
        - generic [ref=e38]:
          - paragraph [ref=e39]: webNavigation
          - paragraph [ref=e40]: Required as a backup mechanism to detect navigation to blocked sites.
        - generic [ref=e41]:
          - paragraph [ref=e42]: alarms
          - paragraph [ref=e43]: Required for periodic time tracking updates.
  - generic [ref=e44]:
    - heading "Data Collection" [level=2] [ref=e45]
    - generic [ref=e46]:
      - paragraph [ref=e47]: "This extension does not collect any data. Specifically:"
      - list [ref=e48]:
        - listitem [ref=e49]: —No personal information is collected
        - listitem [ref=e50]: —No browsing history is collected or transmitted
        - listitem [ref=e51]: —No analytics or tracking scripts are included
        - listitem [ref=e52]: —No data is sent to any server or third party
        - listitem [ref=e53]: —No cookies are set or read by the extension
        - listitem [ref=e54]: —No user accounts are created or required
  - generic [ref=e55]:
    - heading "Third-Party Services" [level=2] [ref=e56]
    - generic [ref=e57]: This extension does not use any third-party services, APIs, or SDKs. All code and assets are bundled locally in the extension package.
  - generic [ref=e58]:
    - heading "Data Deletion" [level=2] [ref=e59]
    - generic [ref=e60]: All extension data can be deleted at any time by uninstalling the extension or clearing the extension's storage through Chrome's settings. Since no data is stored externally, uninstalling the extension permanently removes all associated data.
